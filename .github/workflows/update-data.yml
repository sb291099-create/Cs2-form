name: Обновить данные

on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов: результаты, ближайшие матчи и новости
  workflow_dispatch:      # кнопка «Run workflow» для ручного запуска
    inputs:
      odds:
        description: "Скачать кэфы сейчас (тратит запросы OddsPapi)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m cs2form.update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Кэфы букмекеров
        run: python -m cs2form.odds
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_FORCE: ${{ inputs.odds && '1' || '' }}
      - name: Сохранить данные в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Новых данных нет" && exit 0
          git commit -m "Данные за $(date -u +%Y-%m-%d)"
          git push
